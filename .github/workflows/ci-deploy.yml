name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify static production output
        run: |
          test -s dist/permis-ya-biso-moko/browser/index.html
          test -s dist/permis-ya-biso-moko/browser/404.html
          test -f dist/permis-ya-biso-moko/browser/.nojekyll
          test -s dist/permis-ya-biso-moko/browser/CNAME
          test "$(cat dist/permis-ya-biso-moko/browser/CNAME)" = "permisyabisomoko.fr"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/permis-ya-biso-moko/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
